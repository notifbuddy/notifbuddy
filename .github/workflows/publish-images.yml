name: Publish images → iac deploy

# Builds backend + authd, pushes to GHCR, then dispatches notifbuddy/iac
# helm-deploy.yml with image_tag=src-<sha>. Dashboard stays on Cloudflare
# (dashboard-deploy.yml) — same Worker arch as landing/docs.
#
# Prereqs:
#   - Infisical notifbuddy-app-ci (OIDC): /ci (GitHub App for cross-repo dispatch)
#   - GHCR packages public (or cluster pull creds)
#   - iac helm-deploy.yml + /ovh/KUBECONFIG in Infisical (notifbuddy-ci)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'authd/**'
      - 'shared/**'
      - 'config/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Infisical OIDC → GitHub App for dispatch
  packages: write # GHCR

concurrency: publish-images

env:
  REGISTRY: ghcr.io/notifbuddy

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.any == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            any:
              - 'backend/**'
              - 'authd/**'
              - 'shared/**'
              - 'config/**'
              - '.github/workflows/publish-images.yml'

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: authd
            context: .
            dockerfile: authd/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:src-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

  dispatch:
    needs: [changes, build]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub App creds from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          identity-id: cfd37faa-b0db-46d6-8a16-a3fc85ff9ebf # notifbuddy-app-ci
          project-slug: notifbuddy-58-th
          env-slug: prod
          secret-path: /ci
          export-type: env

      - name: Mint cross-repo App token for notifbuddy/iac
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.NOTIFBUDDY_CI_APP_ID }}
          private-key: ${{ env.NOTIFBUDDY_CI_PRIVATE_KEY }}
          owner: notifbuddy
          repositories: iac

      - name: Dispatch iac helm-deploy
        env:
          GH_TOKEN: ${{ steps.apptoken.outputs.token }}
        run: |
          gh workflow run helm-deploy.yml \
            --repo notifbuddy/iac \
            --field image_tag="src-${GITHUB_SHA}"
