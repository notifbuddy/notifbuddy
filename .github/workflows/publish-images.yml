name: Publish images → helm deploy

# Builds backend + authd + dashboard, pushes to GHCR, then helm-upgrades onto
# OVH k3s (inline). Replaces Artifact Registry + Cloud Run and the separate
# iac helm-deploy workflow.
#
# Prereqs:
#   - Infisical notifbuddy-app-ci (OIDC): /ci (GitHub App), /ovh, /auth, /
#   - GHCR packages public (or cluster pull creds)
#   - /ovh/KUBECONFIG in Infisical

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'authd/**'
      - 'frontend/**'
      - 'shared/**'
      - 'config/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  packages: write # GHCR

concurrency: publish-images

env:
  REGISTRY: ghcr.io/notifbuddy

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.any == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            any:
              - 'backend/**'
              - 'authd/**'
              - 'frontend/**'
              - 'shared/**'
              - 'config/**'
              - '.github/workflows/publish-images.yml'

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: authd
            context: .
            dockerfile: authd/Dockerfile
          - image: dashboard
            context: .
            dockerfile: frontend/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:src-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64

  deploy:
    needs: [changes, build]
    if: >-
      !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.build.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Fetch GitHub App creds from Infisical (OIDC)
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          identity-id: cfd37faa-b0db-46d6-8a16-a3fc85ff9ebf # notifbuddy-app-ci
          project-slug: notifbuddy-58-th
          env-slug: prod
          secret-path: /ci
          export-type: env

      - name: Mint App token for notifbuddy/iac
        id: apptoken
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ env.NOTIFBUDDY_CI_APP_ID }}
          private-key: ${{ env.NOTIFBUDDY_CI_PRIVATE_KEY }}
          owner: notifbuddy
          repositories: iac

      - name: Checkout iac (values + chart pin)
        uses: actions/checkout@v4
        with:
          repository: notifbuddy/iac
          token: ${{ steps.apptoken.outputs.token }}
          path: iac

      - name: Fetch /ovh (KUBECONFIG)
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          identity-id: cfd37faa-b0db-46d6-8a16-a3fc85ff9ebf
          project-slug: notifbuddy-58-th
          env-slug: prod
          secret-path: /ovh
          export-type: env

      - name: Fetch /auth
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          identity-id: cfd37faa-b0db-46d6-8a16-a3fc85ff9ebf
          project-slug: notifbuddy-58-th
          env-slug: prod
          secret-path: /auth
          export-type: env

      - name: Fetch / (integrations)
        uses: Infisical/secrets-action@v1.0.7
        with:
          method: oidc
          identity-id: cfd37faa-b0db-46d6-8a16-a3fc85ff9ebf
          project-slug: notifbuddy-58-th
          env-slug: prod
          secret-path: /
          export-type: env

      - name: Write kubeconfig + install helm
        run: |
          test -n "${KUBECONFIG:-}" || { echo "KUBECONFIG missing from Infisical /ovh" >&2; exit 1; }
          umask 077
          printf '%s\n' "$KUBECONFIG" >"$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >>"$GITHUB_ENV"
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash

      - name: Resolve values.yaml refs + helm upgrade --install
        env:
          IMAGE_TAG: src-${{ github.sha }}
        run: |
          set -euo pipefail
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          VERSION=$(yq -r '.helmfile.chart_version' iac/config.yaml)
          echo "chart=${VERSION} image.tag=${IMAGE_TAG}"

          kubectl get nodes -o wide

          python3 <<'PY'
          import os, re, pathlib
          src = pathlib.Path("iac/helmfile/values.yaml").read_text()
          pat = re.compile(r"ref\+infisical://([A-Za-z0-9_]+)\?[^\s\"']+")
          missing = []
          def repl(m):
              name = m.group(1)
              val = os.environ.get(name)
              if not val:
                  missing.append(name)
                  return m.group(0)
              return '"' + val.replace("\\", "\\\\").replace('"', '\\"').replace("\n", "\\n") + '"'
          out = pat.sub(repl, src)
          if missing:
              raise SystemExit(f"missing env for Infisical refs: {', '.join(sorted(set(missing)))}")
          dest = pathlib.Path(os.environ["RUNNER_TEMP"]) / "values.resolved.yaml"
          dest.write_text(out)
          print(f"wrote {dest}")
          PY

          helm upgrade --install notifbuddy \
            oci://ghcr.io/notifbuddy/charts/notifbuddy \
            --version "$VERSION" \
            --namespace notifbuddy \
            --create-namespace \
            --wait \
            --timeout 10m \
            -f "$RUNNER_TEMP/values.resolved.yaml" \
            --set-string "image.tag=${IMAGE_TAG}"

          kubectl -n notifbuddy get pods,ingress,svc
