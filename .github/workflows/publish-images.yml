name: Publish images

# Builds backend + authd and pushes them to GHCR as src-<sha> and main.
# Dashboard stays on Cloudflare (dashboard-deploy.yml) — same Worker arch as
# landing/docs.
#
# This does NOT deploy (NOT-60). Prod runs the chart version pinned in iac's
# config.yaml, and that line only moves through a release PR — so main builds
# are available to pull but never roll the cluster on their own. Cut a tag to
# ship them: release.yml publishes the chart and opens the iac PR.
#
# Prereqs:
#   - GHCR packages public (or cluster pull creds)

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'authd/**'
      - 'shared/**'
      - 'config/**'
      - '.github/workflows/publish-images.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR

concurrency: publish-images

env:
  REGISTRY: ghcr.io/notifbuddy

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      any: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.any == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            any:
              - 'backend/**'
              - 'authd/**'
              - 'shared/**'
              - 'config/**'
              - '.github/workflows/publish-images.yml'

  build:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          - image: authd
            context: .
            dockerfile: authd/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build + push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:src-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:main
          cache-from: type=gha,scope=${{ matrix.image }}-amd64
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-amd64
