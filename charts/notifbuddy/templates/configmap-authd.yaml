apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "notifbuddy.fullname" . }}-authd
  labels:
    {{- include "notifbuddy.labels" . | nindent 4 }}
data:
  config.yaml: |
    server:
      port: 8787

    auth:
      # Public URL: this one is browser-facing (OAuth redirects come back to
      # it), so unlike the backend's it cannot be the in-cluster address.
      base_url: "https://{{ include "notifbuddy.host.auth" . }}"
      secret: "${BETTER_AUTH_SECRET}"
      # Parent of all three hostnames, so the dashboard and API both see the
      # session cookie this service sets.
      cookie_domain: {{ include "notifbuddy.cookieDomain" . | quote }}

    database:
      url: "${DATABASE_URL}"

    cors:
      trusted_origins:
        - "https://{{ include "notifbuddy.host.dashboard" . }}"

    slack:
      client_id: {{ required "notifbuddy: set `slack.clientId` — Slack OAuth is the only sign-in method" .Values.slack.clientId | quote }}
      client_secret: "${SLACK_LOGIN_CLIENT_SECRET}"

    email:
    {{- if .Values.integrations.email.enabled }}
      resend_api_key: "${RESEND_API_KEY}"
      from: {{ required "notifbuddy: set `integrations.email.from` when email is enabled" .Values.integrations.email.from | quote }}
    {{- else }}
      # No key: organisation invitations are logged by this service rather
      # than emailed. Invite links still work if you copy them out of the log.
      resend_api_key: ""
      from: ""
    {{- end }}
      # Welcome email links: CTA opens this install's dashboard; support goes
      # to the notifbuddy community Slack.
      dashboard_url: "https://{{ include "notifbuddy.host.dashboard" . }}"
      community_slack_url: "https://join.slack.com/t/notifbuddyworkspace/shared_invite/zt-43vft932a-AHlUb6eK5ssnJMBIpkyOWw"

    device_auth:
      # CLI device-flow login: the dashboard page where the user enters the
      # one-time code shown in their terminal.
      verification_url: "https://{{ include "notifbuddy.host.dashboard" . }}/device"
