# authd local config (config/authd/local.yaml). Secrets via ${VAR}.
# Override with CONFIG_FILE=... or NB_ENV=local|prod|preview.

server:
  port: 8787 # PORT env (Cloud Run contract) wins when set

auth:
  base_url: "http://localhost:8787" # public base URL of this service
  secret: "${BETTER_AUTH_SECRET}" # SECRET — signing/encryption key (openssl rand -base64 32)
  cookie_domain: "" # empty locally; prod ".notifbuddy.com" so api.* sees the session cookie
  cookie_prefix: "" # empty → Better Auth default "better-auth"

database:
  # Dedicated database on the same homebrew postgres as the backend:
  #   psql -d postgres -c "CREATE DATABASE authd;"
  url: "postgres://localhost/authd"

cors:
  trusted_origins: # browser origins allowed to call authd (the dashboard SPA)
    - "http://localhost:5173"

slack:
  # Sign in with Slack (OIDC) — the only sign-in method. Same Slack app as the
  # backend integration (config/backend/local.yaml); its manifest must list
  # the callback: <auth.base_url>/api/auth/callback/slack
  client_id: "11589880917329.11617102178177"
  client_secret: "${SLACK_CLIENT_SECRET}" # SECRET

email:
  resend_api_key: "${RESEND_API_KEY}" # SECRET — empty = invitation emails go to the console (dev sink)
  from: "notifbuddy <auth@notifications.notifbuddy.com>"
  dashboard_url: "http://localhost:5173" # welcome email CTA target
  community_slack_url: "https://join.slack.com/t/notifbuddyworkspace/shared_invite/zt-43vft932a-AHlUb6eK5ssnJMBIpkyOWw"

device_auth:
  verification_url: "http://localhost:5173/device" # dashboard page where the user enters the CLI code
